# Disable all HDMI/DisplayPort audio sinks.
# In my current setups, this rule only matches external monitors.
# Matches by node name to work across machines.
monitor.alsa.rules = [
  {
    matches = [
      # [Hh][Dd][Mm][Ii] covers both UCM-style names (HiFi__HDMI1__sink)
      # and classic HDA-style names (hdmi-stereo).
      # Tilde prefix makes it a regex rule.
      { node.name = "~alsa_output.*[Hh][Dd][Mm][Ii].*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
